services:
  shuangyun-v2:
    build:
      context: .
      dockerfile: Dockerfile
    image: shuangyun-agent-v2:local
    container_name: shuangyun-v2
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_PATH: /app/data/shuangyun-v2.db
      TRACE_EXPORT_DIR: /app/data/traces
    volumes:
      - ./data:/app/data
      - "C:/Users/gjj22/OneDrive/双云AI轉型教育訓練/06_Skills/双云技能包:/app/skills:ro"
    restart: unless-stopped
